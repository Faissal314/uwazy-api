spring.application.name=uwazy-api
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/uwazy_db
spring.datasource.username=postgres
spring.datasource.password=Faissal21
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# secret-key must be Base64 encoded; legacy hex values are also recognised by the
# JwtService helper. To generate a new key you can run e.g.:
#   openssl rand -base64 32
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Static Resources
spring.web.resources.static-locations=file:uploads/
